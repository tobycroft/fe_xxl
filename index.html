<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>连连看</title>
  <link rel="stylesheet" href="./main.css?v=20260928j">
</head>
<body>
  <div class="wrapper">
    <div class="welcome-box" id="welcomeBox">
      <h1 class="welcome-title">连连看</h1>
      <p class="welcome-sub">点击下方按钮开始游戏</p>
      <div class="welcome-start" id="welcomeStart">开始游戏</div>
    </div>
    <div class="init-box hidden">
      <div class="start-btn">
      </div>
    </div>
    <div class="game-box">
      <div class="toolbar">
        <div class="time"></div>
        <div class="level"></div>
        <div class="disorder"></div>
        <div class="scoring"></div>
      </div>
      <div class="game-area">
        <table id="game">
          <canvas id="canvas" class="hidden" width=840 height=1400></canvas>
        </table>
      </div>
    </div>
    <div class="game-over hidden">
      <div class="current-score"></div>
      <div class="history-score"></div>
      <div class="replay-btn"></div>
    </div>
    <div class="music-toggle" id="musicToggle"></div>
    <audio class="hidden" src="./bg.mp3" loop="loop"></audio>

  </div>
  <script src="./zepto.min.js?v=20260928j"></script>
  <script src="./main.js?v=20260928j"></script>
</body>
</html>
