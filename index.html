<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>连连看</title>
  <link rel="stylesheet" href="./main.css?v=20260928m">
</head>
<body>
  <div class="wrapper">
    <div class="welcome-box" id="welcomeBox">
      <h1 class="welcome-title">连连看</h1>
      <p class="welcome-sub">点击下方按钮开始游戏</p>
      <div class="welcome-start" id="welcomeStart">开始游戏</div>
    </div>
    <div class="init-box hidden">
      <div class="start-btn">
      </div>
    </div>
    <div class="game-box">
      <div class="toolbar">
        <div class="time"></div>
        <div class="level"></div>
        <div class="disorder"></div>
        <div class="scoring"></div>
      </div>
      <div class="game-area">
        <table id="game">
          <canvas id="canvas" class="hidden" width=840 height=1400></canvas>
        </table>
      </div>
    </div>
    <div class="game-over hidden" id="gameOver">
      <div class="game-over-panel">
        <div class="game-over-title">游戏结束</div>
        <div class="game-over-label">本次得分</div>
        <div class="game-over-score" id="finalScore">0</div>
        <div class="game-over-history">历史最高：<span id="historyScore">0</span></div>
        <div class="game-over-btns">
          <div class="game-over-btn go-replay" id="goReplay">重玩</div>
          <div class="game-over-btn go-home" id="goHome">返回首页</div>
        </div>
      </div>
    </div>
    <div class="level-pass hidden" id="levelPass">
      <div class="level-pass-panel">
        <div class="level-pass-title">挑战成功！</div>
        <div class="level-pass-info">即将进入第 <span id="passNextLevel"></span> 关</div>
        <div class="level-pass-btns">
          <div class="level-pass-btn pass-continue" id="passContinue">继续挑战</div>
          <div class="level-pass-btn pass-exit" id="passExit">退出</div>
        </div>
      </div>
    </div>
    <div class="music-toggle" id="musicToggle"></div>
    <audio class="hidden" src="./bg.mp3" loop="loop"></audio>

  </div>
  <script src="./zepto.min.js?v=20260928m"></script>
  <script src="./main.js?v=20260928m"></script>
</body>
</html>
